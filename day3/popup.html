<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>学堂 × 雨课堂 合一工作台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 300px;
      padding: 18px;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      background: #f8f9fc;
      color: #0f172a;
    }
    .logo {
      font-size: 16px;
      font-weight: 800;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .sub {
      font-size: 11.5px;
      color: #64748b;
      margin-top: 3px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .pill {
      flex: 1;
      background: #fff;
      border: 1px solid rgba(15, 23, 42, 0.08);
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 11.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #334155;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #94a3b8;
      flex-shrink: 0;
    }
    .dot.ok { background: #10b981; }
    .dot.warn { background: #f59e0b; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }
    .metric {
      background: #fff;
      border-radius: 10px;
      padding: 9px 6px;
      text-align: center;
      border: 1px solid rgba(15, 23, 42, 0.06);
    }
    .metric-val {
      font-size: 18px;
      font-weight: 800;
      color: #4f46e5;
    }
    .metric-val.danger { color: #ef4444; }
    .metric-lbl {
      font-size: 10.5px;
      color: #64748b;
      margin-top: 2px;
    }

    .btn-primary {
      width: 100%;
      padding: 11px;
      border-radius: 11px;
      border: none;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }
    .btn-primary:hover { opacity: 0.93; }

    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #64748b;
      text-align: center;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="logo">✨ 学堂 × 雨课堂</div>
  <div class="sub">双平台课程聚合与全屏覆盖工作台</div>

  <div class="status-row">
    <div class="pill"><span class="dot" id="dot-w"></span><span id="txt-w">📘 学堂检测中</span></div>
    <div class="pill"><span class="dot" id="dot-y"></span><span id="txt-y">🌧️ 雨课堂检测中</span></div>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="metric-val" id="m-ddl">-</div>
      <div class="metric-lbl">待交 DDL</div>
    </div>
    <div class="metric">
      <div class="metric-val" id="m-notice">-</div>
      <div class="metric-lbl">未读公告</div>
    </div>
    <div class="metric">
      <div class="metric-val" id="m-merged">-</div>
      <div class="metric-lbl">合体课程</div>
    </div>
  </div>

  <button class="btn-primary" id="btn-launch">🚀 启动全屏合一工作台</button>
  <div class="hint" id="hint-text">支持在学堂或雨课堂页面按 Alt + K 随时切换</div>

  <script src="popup.js"></script>
</body>
</html>
